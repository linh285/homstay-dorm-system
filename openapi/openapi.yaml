  /settlements/{id}/deductions:
    put: { summary: Replace settlement deductions, tags: [Settlements], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /settlements/{id}/calculate:
    post: { summary: Calculate settlement, tags: [Settlements], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /settlements/{id}/finalize:
    post: { summary: Finalize settlement, tags: [Settlements], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /settlements/{id}/customer-agreed:
    post: { summary: Confirm customer agreement, tags: [Settlements], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /settlements/{id}/disputed:
    post: { summary: Mark settlement disputed, tags: [Settlements], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /settlements/{id}/return-to-accountant:
    post: { summary: Return settlement to accountant, tags: [Settlements], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /settlements/{id}/record-additional-payment:
    post: { summary: Record additional payment, tags: [Settlements], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /settlements/{id}/record-refund:
    post: { summary: Record refund, tags: [Settlements], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /settlements/{id}/confirm-no-balance:
    post: { summary: Confirm zero balance, tags: [Settlements], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /settlements/{id}/confirm-liquidation:
    post: { summary: Confirm liquidation, tags: [Settlements], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /settlements/{id}/complete-checkout:
    post: { summary: Complete checkout, tags: [Settlements], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /dashboard:
    get: { summary: Get role dashboard, tags: [Dashboard], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /employees:
    get: { summary: List employees, tags: [Administration], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /branches:
    get: { summary: List branches, tags: [Administration], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /branches/{id}:
    get: { summary: Get branch, tags: [Administration], responses: { '200': { $ref: '#/components/responses/Success' } } }
    patch: { summary: Update branch basics, tags: [Administration], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /reports/branch-summary:
    get: { summary: Get branch summary, tags: [Reports], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /reports/system-summary:
    get: { summary: Get system summary, tags: [Reports], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /reports/occupancy:
    get: { summary: Get occupancy report, tags: [Reports], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /reports/rental-funnel:
    get: { summary: Get rental funnel report, tags: [Reports], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /reports/deposits:
    get: { summary: Get deposit report, tags: [Reports], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /reports/check-ins-checkouts:
    get: { summary: Get check-in and checkout report, tags: [Reports], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /reports/financial-summary:
    get: { summary: Get financial summary, tags: [Reports], responses: { '200': { $ref: '#/components/responses/Success' } } }
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: homestay_access_token
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  responses:
    Success:
      description: Standard success envelope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SuccessEnvelope' }
    Error:
      description: Standard error envelope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    SuccessEnvelope:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, const: true }
        data: {}
        meta: {}
    ErrorEnvelope:
      type: object
      required: [success, data, meta, error]
      properties:
        success: { type: boolean, const: false }
        data: { type: 'null' }
        meta: { type: 'null' }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: {}
    RentalRequestCreate:
      type: object
      required: [customer, rentalRequest]
      properties:
        customer: { type: object }
        rentalRequest: { type: object }
    RoomMatch:
      type: object
      required:
        [roomId, roomName, matchScore, availableBedCount, availableBeds, monthlyRent]
      properties:
        roomId: { type: string }
        roomName: { type: string }
        matchScore: { type: integer, minimum: 0 }
        matchedPreferences:
          type: array
          items: { type: string }
        unmatchedPreferences:
          type: array
          items: { type: string }
        availableBedCount: { type: integer, minimum: 0 }
        availableBeds:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              monthlyRent: { type: string, pattern: '^\\d+\\.\\d{2}$' }
        roomType: { type: [string, 'null'] }
        area: { type: [string, 'null'] }
        genderPolicy: { type: [string, 'null'] }
        quietLevel: { type: [string, 'null'] }
        curfew: { type: [string, 'null'] }
        rules: { type: [string, 'null'] }
        services: { type: array, items: { type: object } }
        assets: { type: array, items: { type: object } }
        monthlyRent: { type: string, pattern: '^\\d+\\.\\d{2}$' }
