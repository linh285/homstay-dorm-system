openapi: 3.1.0
info:
  title: HomeStay Dorm API
  version: 1.0.0
  description: |
    API nội bộ HomeStay Dorm. Giá trị enum giữ tiếng Anh; nhãn tiếng Việt chỉ
    thuộc frontend. Hợp đồng nghiệp vụ chi tiết nằm tại docs/08-api-contract.md.
servers:
  - url: http://localhost:3000/api/v1
security:
  - cookieAuth: []
paths:
  /health:
    get:
      summary: Health check
      security: []
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
  /auth/login:
    post:
      summary: Đăng nhập nhân viên
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      summary: Đăng xuất idempotent và xóa cookie phiên
      security: []
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /auth/me:
    get:
      summary: Lấy nhân viên đang đăng nhập
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Error' }
  /rental-requests:
    get:
      summary: Danh sách yêu cầu thuê của Sale theo chi nhánh
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      summary: Tạo yêu cầu thuê ở trạng thái ACTIVE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RentalRequestCreate'
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /rental-requests/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      summary: Chi tiết yêu cầu thuê
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      summary: Cập nhật thông tin khách hoặc nhu cầu thuê
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Error' }
  /rental-requests/{id}/members:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      summary: Thêm RequestMember loại INDIVIDUAL với participationStatus PLANNED
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '422': { $ref: '#/components/responses/Error' }
  /rental-requests/{id}/members/{memberId}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - name: memberId
        in: path
        required: true
        schema: { type: string }
    patch:
      summary: Cập nhật thành viên dự kiến
      responses:
        '200': { $ref: '#/components/responses/Success' }
    delete:
      summary: Xóa thành viên dự kiến
      responses:
        '204': { description: Deleted }
  /rental-requests/{id}/search-rooms:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      summary: Tìm phòng phù hợp mà không tạo allocation
      description: |
        Chỉ Sale cùng chi nhánh. Không nhận body; memberCount phải bằng
        expectedResidents. Chỉ ràng buộc cứng mới loại phòng. Kết quả ổn định
        theo matchScore giảm, availableBedCount giảm, monthlyRent tăng, roomId tăng.
      responses:
        '200':
          description: Danh sách phòng đạt ràng buộc cứng
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/RoomMatch' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /rental-requests/{id}/close:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      summary: Đóng yêu cầu thuê ACTIVE hoặc VIEWING
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Error' }
  /rooms:
    get: { summary: List rooms, tags: [Rooms], responses: { '200': { $ref: '#/components/responses/Success' } } }
    post: { summary: Create room, tags: [Rooms], responses: { '201': { $ref: '#/components/responses/Success' } } }
  /rooms/{id}:
    get: { summary: Get room, tags: [Rooms], responses: { '200': { $ref: '#/components/responses/Success' } } }
    patch: { summary: Update room, tags: [Rooms], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /rooms/{id}/availability:
    get: { summary: Get room and bed availability, tags: [Rooms], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /rooms/{id}/beds:
    post: { summary: Add bed to room, tags: [Rooms], responses: { '201': { $ref: '#/components/responses/Success' } } }
  /rooms/{id}/assets:
    get: { summary: Get room assets, tags: [Rooms], responses: { '200': { $ref: '#/components/responses/Success' } } }
    put: { summary: Replace room assets, tags: [Rooms], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /rooms/{id}/services:
    put: { summary: Replace room services, tags: [Rooms], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /beds/{id}:
    patch: { summary: Update bed, tags: [Rooms], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /services:
    get: { summary: List service catalog, tags: [Rooms], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /asset-types:
    get: { summary: List asset type catalog, tags: [Rooms], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /viewings:
    get: { summary: List viewings, tags: [Viewings], responses: { '200': { $ref: '#/components/responses/Success' } } }
    post: { summary: Create viewing, tags: [Viewings], responses: { '201': { $ref: '#/components/responses/Success' } } }
  /viewings/{id}:
    get: { summary: Get viewing, tags: [Viewings], responses: { '200': { $ref: '#/components/responses/Success' } } }
    patch: { summary: Update viewing, tags: [Viewings], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /viewings/{id}/confirm:
    post: { summary: Confirm viewing, tags: [Viewings], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /viewings/{id}/reschedule:
