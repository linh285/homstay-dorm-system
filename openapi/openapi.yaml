  /contracts/{id}/record-paper-contract:
    post: { summary: Record paper contract, tags: [Contracts], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /contracts/{id}/confirm-paper-signing:
    post: { summary: Confirm paper signing, tags: [Contracts], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /contracts/{id}/create-initial-payment:
    post: { summary: Create initial payment, tags: [Contracts], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /contracts/{id}/record-initial-payment:
    post: { summary: Record initial payment, tags: [Contracts], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /contracts/{id}/confirm-initial-payment:
    post: { summary: Confirm initial payment, tags: [Contracts], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /contracts/{id}/submit-handover:
    post: { summary: Submit handover, tags: [Contracts], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /contracts/{contractId}/handovers:
    post: { summary: Create handover, tags: [Handovers], responses: { '201': { $ref: '#/components/responses/Success' } } }
  /handovers/{id}:
    get: { summary: Get handover, tags: [Handovers], responses: { '200': { $ref: '#/components/responses/Success' } } }
    patch: { summary: Update handover, tags: [Handovers], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /handovers/{id}/assets:
    put: { summary: Replace handover assets, tags: [Handovers], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /handovers/{id}/complete:
    post: { summary: Complete handover, tags: [Handovers], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /checkout-requests:
    get: { summary: List checkout requests, tags: [Checkout], responses: { '200': { $ref: '#/components/responses/Success' } } }
    post: { summary: Create checkout request, tags: [Checkout], responses: { '201': { $ref: '#/components/responses/Success' } } }
  /checkout-requests/{id}:
    get: { summary: Get checkout request, tags: [Checkout], responses: { '200': { $ref: '#/components/responses/Success' } } }
    patch: { summary: Update checkout request, tags: [Checkout], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /checkout-requests/{id}/submit:
    post: { summary: Submit checkout request, tags: [Checkout], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /checkout-requests/{id}/cancel:
    post: { summary: Cancel checkout request, tags: [Checkout], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /checkout-requests/{id}/inspection:
    post: { summary: Create checkout inspection, tags: [Checkout], responses: { '201': { $ref: '#/components/responses/Success' } } }
  /checkout-requests/{id}/settlement:
    post: { summary: Create settlement, tags: [Settlements], responses: { '201': { $ref: '#/components/responses/Success' } } }
  /checkout-inspections/{id}:
    get: { summary: Get checkout inspection, tags: [Checkout], responses: { '200': { $ref: '#/components/responses/Success' } } }
    patch: { summary: Update checkout inspection, tags: [Checkout], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /checkout-inspections/{id}/items:
    put: { summary: Replace checkout inspection items, tags: [Checkout], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /checkout-inspections/{id}/complete:
    post: { summary: Complete checkout inspection, tags: [Checkout], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /settlements/{id}:
