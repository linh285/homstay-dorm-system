  /viewings/{id}/cancel:
    post: { summary: Cancel viewing, tags: [Viewings], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /viewings/{id}/no-show:
    post: { summary: Mark viewing no-show, tags: [Viewings], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /viewings/{id}/confirm-visited:
    post: { summary: Confirm customer visited, tags: [Viewings], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /viewings/{id}/result:
    post: { summary: Record viewing result, tags: [Viewings], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /viewings/{id}/create-deposit:
    post: { summary: Create deposit from viewing, tags: [Deposits], responses: { '201': { $ref: '#/components/responses/Success' } } }
  /deposits:
    get: { summary: List deposits, tags: [Deposits], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /deposits/{id}:
    get: { summary: Get deposit, tags: [Deposits], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /deposits/{id}/confirm-customer-rules:
    post: { summary: Confirm customer rules, tags: [Deposits], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /deposits/{id}/submit-room-check:
    post: { summary: Submit room check, tags: [Deposits], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /deposits/{id}/approve-room:
    post: { summary: Approve deposit room, tags: [Deposits], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /deposits/{id}/reject-room:
    post: { summary: Reject deposit room, tags: [Deposits], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /deposits/{id}/issue-payment-request:
    post: { summary: Issue deposit payment request, tags: [Deposits], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /deposits/{id}/record-payment:
    post: { summary: Record deposit payment, tags: [Deposits], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /deposits/{id}/approve-payment:
    post: { summary: Approve deposit payment, tags: [Deposits], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /deposits/{id}/request-payment-recheck:
    post: { summary: Request payment recheck, tags: [Deposits], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /deposits/{id}/reject-payment:
