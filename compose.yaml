services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: homestay_dorm
      POSTGRES_USER: homestay
      POSTGRES_PASSWORD: homestay_password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U homestay -d homestay_dorm']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://homestay:homestay_password@db:5432/homestay_dorm
      CORS_ORIGIN: http://localhost:5173
      JWT_SECRET: development-only-jwt-secret-change-me-12345
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/v1/health']
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      VITE_API_PROXY_TARGET: http://api:3000
    ports:
      - '5173:5173'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:5173']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
